[package]
name = "minesweeper"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
xark = "0.3"
xark-poseidon2 = "0.3"

# `xark build` compiles the crate for wasm32 with `--cfg xark`; host code that only
# tests and the TypeScript client run sits behind `#[cfg(not(xark))]`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }

[workspace]
